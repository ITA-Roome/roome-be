name: roome-server CI CD

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.0

      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build -x test

      - name: Build and push Docker image
        env:
          DOCKER_USERNAME: ${{secrets.DOCKER_USERNAME}}
          DOCKER_PASSWORD: ${{secrets.DOCKER_PASSWORD}}
        run: |
          docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD
          docker buildx build \
          --platform linux/amd64 \
          -t $DOCKER_USERNAME/${{secrets.DOCKER_REPOSITORY}}:latest \
          --push .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.0

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{secrets.EC2_HOST}}
          username: ubuntu
          key: ${{secrets.EC2_PRIVATE_KEY}}
          port: 22
          script: |
            cd /home/ubuntu

            echo ">>> 최신 .env 생성 중..."
            cat > .env << 'EOF'
            DB_URL=${{ secrets.DB_URL }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}

            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_TOKEN_EXPIRATION=${{ secrets.JWT_TOKEN_EXPIRATION }}
            REFRESH_TOKEN_EXPIRATION=${{ secrets.REFRESH_TOKEN_EXPIRATION }}

            KAKAO_CLIENT_ID=${{ secrets.KAKAO_CLIENT_ID }}
            KAKAO_CLIENT_SECRET=${{ secrets.KAKAO_CLIENT_SECRET }}
            KAKAO_REDIRECT_URI=${{ secrets.KAKAO_REDIRECT_URI }}

            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            GOOGLE_REDIRECT_URI=${{ secrets.GOOGLE_REDIRECT_URI }}

            EMAIL_PASSWORD=${{ secrets.EMAIL_PASSWORD }}
            EMAIL_SENDER_ADDRESS=${{ secrets.EMAIL_SENDER_ADDRESS }}
            EMAIL_USERNAME=${{ secrets.EMAIL_USERNAME }}
            
            CLOUD_AWS_CREDENTIALS_ACCESS_KEY=${{secrets.S3_ACCESS_KEY}}
            CLOUD_AWS_CREDENTIALS_SECRET_KEY=${{secrets.S3_SECRET_KEY}}
            CLOUD_AWS_S3_BUCKET=${{secrets.S3_BUCKET_NAME}}
            CLOUD_AWS_REGION_STATIC=${{secrets.S3_REGION}}
            
            CDN_BASE_URL=${{ secrets.CDN_BASE_URL }}
            SHOP_LOGO=${{ secrets.SHOP_LOGO }}
            STORAGE_CDN_BASE_URL=${{ secrets.CDN_BASE_URL }}
            
            EOF
         
            sudo chmod +x deploy.sh
            sudo ./deploy.sh
            sudo docker image prune -af
